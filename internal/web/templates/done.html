{{define "content"}}
<h1 class="section">done</h1>
{{range .Cards}}
<article class="card">
  <div class="meta">
    <span class="badge">{{.State}}</span>
    <span>{{.Kind}}</span>
    {{with .Worker}}<span>{{.}}</span>{{end}}
    {{range .Labels}}<span class="tag">{{.}}</span>{{end}}
    <span class="age">{{.Age}}</span>
  </div>
  <h2><a href="/cases/{{.ID | pathEscape}}">{{.Title}}</a></h2>
  {{with .Close}}<div class="outcome body">{{markdown .Outcome}}</div>{{end}}
</article>
{{else}}
<p class="empty">nothing done yet.</p>
{{end}}
{{end}}
