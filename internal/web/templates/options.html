{{define "content"}}
<h1 class="section">options</h1>
<p class="label">kept in this browser. changes apply at once.</p>
<form id="options" class="options">
  <fieldset>
    <legend>theme</legend>
    <label class="choice"><input type="radio" name="theme" value="system" checked> system</label>
    <label class="choice"><input type="radio" name="theme" value="light"> light</label>
    <label class="choice"><input type="radio" name="theme" value="dark"> dark</label>
  </fieldset>
  <fieldset>
    <legend>prose face</legend>
    <label class="choice"><input type="radio" name="face" value="mono" checked> mono</label>
    <label class="choice"><input type="radio" name="face" value="sans"> <span class="face-sans">sans</span></label>
    <label class="choice"><input type="radio" name="face" value="serif"> <span class="face-serif">serif</span></label>
  </fieldset>
  <fieldset>
    <legend>links to other sites</legend>
    <label class="choice"><input type="radio" name="links" value="new" checked> open in a new tab</label>
    <label class="choice"><input type="radio" name="links" value="same"> open in this tab</label>
  </fieldset>
  <div class="actions"><button type="button" id="options-reset">reset</button></div>
</form>
{{end}}
