# cargo-mutants: https://mutants.rs/
# Each exclusion is a mutant no test can catch, with the reason. Match on
# the mutant's text, not its line, so an exclusion outlives edits nearby.
exclude_re = [
    # Equivalent: when the times are equal, `updated_at` is set to the value
    # it already holds.
    'replace > with >= in Case::take',
    # The message of a serde error, which reaches only an Error's message;
    # messages are not part of the contract.
    "UniqueVisitor>::expecting -> fmt::Result with Ok\\(Default::default\\(\\)\\)",
    # Equivalent under the contract: a fraction reads as null, and in a field
    # the core defines both are malformed, while a field it does not define
    # is dropped whatever it holds.
    "UniqueVisitor>::visit_f64 -> Result<Value, E> with Ok\\(Default::default\\(\\)\\)",
    # serde_json reading from a &str never calls visit_string: it calls
    # visit_str or visit_borrowed_str.
    "UniqueVisitor>::visit_string -> Result<Value, E> with Ok\\(Default::default\\(\\)\\)",
    # Equivalent: Value::default() is Value::Null.
    "UniqueVisitor>::visit_unit -> Result<Value, E> with Ok\\(Default::default\\(\\)\\)",
    # Equivalent: the store's retry stops at its deadline, and the clock
    # lands on the deadline itself only by a nanosecond's chance.
    'replace < with <= in use_wal',
    # No test can reach it: SQLite gives a journal mode other than WAL only
    # for a database the store never opens, such as one in memory or on a
    # file system without shared memory. A file it cannot switch, such as a
    # read-only one, gives an error, which a test checks.
    'replace match guard mode.eq_ignore_ascii_case\("wal"\) with true in use_wal',
    # Equivalent: each byte is shifted into bits of its own, so or and xor
    # give the same number.
    'replace \| with \^ in base64url',
    # Equivalent: the wait for a child to exit stops at its deadline, and
    # the clock lands on the deadline itself only by a nanosecond's chance.
    'replace < with <= in Pipe::exited',
    # Equivalent: a heartbeat is due once the clock reaches its time, and
    # the clock lands on that time itself only by a nanosecond's chance.
    "replace < with <= in Listening<'a>::beat",
    # No test can reach it: a read of a child's stderr is interrupted only
    # by a signal that lands while it blocks, which a test cannot time.
    'replace match guard error.kind\(\) == io::ErrorKind::Interrupted with (true|false) in Pipe::start',
    # The guard's is the only == in Pipe::start.
    'replace == with != in Pipe::start',
    # No test can reach it: the exit code after the default handler fails
    # to end the process. The handler ends it by the signal, so the code is
    # never read.
    'replace \+ with [-*] in on_signal',
    # No test can reach it: the arm is for a process with no /proc to read
    # the ignored signals from, and on Linux there always is one. Matched by
    # its line and column, as the mask arm's `== 1` has the same text and a
    # test kills that one; move this if the line does.
    'forward\.rs:522:24: replace == with != in left_alone',
    # No command reads a forwarded store's listeners: only the store's own
    # trait carries the method (the dial route and `cases serve` answer it
    # from the local store, which their own tests check).
    'replace <impl Store for Forwarded>::listeners .* with Ok\(vec!\[\]\)',
    # Equivalent: a report has a pid only when its inbox runs, as both are
    # set together from the instance file.
    'replace match guard report.running with true in write_text',
]
