[workspace]
resolver = "3"
members = ["crates/core", "crates/id", "crates/store-sqlite", "crates/store-remote", "crates/cli", "crates/vectors"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/ryanlewis/cases"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# One match over the kinds, such as check_answer's, reads better whole than split to meet a line count.
too_many_lines = "allow"
# Pairs such as `last` and `list` are plain words for what they hold; renaming them reads worse.
similar_names = "allow"
# `assert!(x.is_empty())` says what a test means; the `assert_eq!(x, [] as [T; 0])` it asks for does not.
assert_is_empty = "allow"
