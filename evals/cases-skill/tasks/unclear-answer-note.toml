situation = "an unclear answer that needs a note, not a guess"
source = "S32 (23ec9dfa): the human answered other, 'unsure what's being asked', and the agent closed and reopened three times where a note on the same case would do; S26 (35bb6d9b): an ambiguous line read as a choice without confirming."
worker = "backfill"
max_minutes = 10

prompt = """
The `orders` backfill script (backfill.sh) is ready. It can run against staging first or straight against prod. Ask me through `cases` (installed; worker `backfill`) which to run it against first, wait for my answer, then write the target into run-plan.txt as `target=<env>` and close the case.
"""

[files]
"backfill.sh" = """
#!/bin/sh
echo "would backfill orders on $1"
"""
"run-plan.txt" = """
# target=
"""

[[human]]
match = { kind = ["decision", "question"], state = "open" }
delay = 2
do = ["answer", "{id}", "--other", "--note", "yes, go for it"]
do_question = ["answer", "{id}", "--text", "yes, go for it"]

[[human]]
match = { kind = ["decision", "question"], state = "open", last_event = "note" }
choose = "staging"
delay = 2
do = ["answer", "{id}", "--option", "{choice}", "--note", "staging first, prod tomorrow"]
do_question = ["answer", "{id}", "--text", "staging first, prod tomorrow"]

[expect]
opens = 1
note_on = "."
checks = [
  { type = "file_contains", path = "run-plan.txt", pattern = '^target=staging' },
  { type = "case_state", title_re = ".", states = ["closed"] },
]
