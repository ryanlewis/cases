name: PR title

# PRs are squash-merged, so the title becomes the commit subject on main.
# Its own workflow, so that editing a title re-runs only this check.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the title is a Conventional Commit subject
        run: .github/scripts/check-pr-title.sh
        env:
          TITLE: ${{ github.event.pull_request.title }}
