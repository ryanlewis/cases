[package]
name = "cases-store-sqlite"
version = "0.0.0"
description = "A cases store in one SQLite file."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
cases-core = { path = "../core" }
cases-id = { path = "../id" }
# The operating system's random bytes, for actor ids.
getrandom = "0.4.3"
# SQLite, built from the source it bundles, so every platform runs the same
# SQLite. The default features add a statement cache and a Wasm build, which
# the store does not use.
rusqlite = { version = "0.41.0", default-features = false, features = ["bundled"] }
serde_json = "1.0.151"

[dev-dependencies]
# The store vectors' runner.
cases-vectors = { path = "../vectors" }
# One test for each vector in the store's run of the core vectors.
libtest-mimic = "=0.8.2"
# `limits`, to make a poll fail part-way in a test, and `trace`, to count the
# statements a read runs.
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled", "limits", "trace"] }
# The core's vector loader, which the store's run shares.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# A directory of its own for each test's store.
tempfile = "=3.27.0"

[lints]
workspace = true

[[test]]
name = "vectors"
harness = false

[[test]]
name = "store_vectors"
harness = false
