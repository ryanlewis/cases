[package]
name = "cases-vectors"
version = "0.0.0"
description = "Runs the store vectors in spec/vectors/store/ against any store that implements the core's Store."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
cases-core = { path = "../core" }
# One test for each vector.
libtest-mimic = "=0.8.2"
# The vectors' JSON.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[lints]
workspace = true
